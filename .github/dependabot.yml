version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Minimum version that the published package depends on, raising it forces consumers to upgrade
      # Serilog is not ignored so that the version the tests run against stays current.
      - dependency-name: Ben.Demystifier

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
